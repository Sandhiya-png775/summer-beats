<!DOCTYPE html>
<html lang="en">
<head>
    <center>
    <title>Register music</title>
    <style>
        *{
            padding-left: 40px;
            padding-right: 40px;
            background-color: rgb(41, 2, 78);
            color: aliceblue;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>
    <h1>SUMMER BEATS'25</h1>
    <h2>Registration Form</h2>
    <hr>
    <form>
        <table>
            <tr>
                <td>Name</td><td><input type="text" placeholder="Enter your Name"></td>
            </tr>
            <tr>
                <td>Email</td><td><input type="text" placeholder="Enter your email"></td>
            </tr>
            <tr>
                <td>Phone number</td><td><input type="number" placeholder="Enter your Mobile number"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" name="gender">male</td>
                <td><input type="radio" name="gender">female</td>
            </tr>
            <tr>
                <td>Ticket type</td>
                <td><input type="radio" name="Ticket">Genral pass</td>
                <td><input type="radio" name="Ticket">VIP PASS</td>
            </tr>
            <tr>
                <td>Favorite Music Genre</td>
                <td>
                    <select>
                        <option>ROCK</option>
                        <option>POP</option>
                        <option>CLASSIC</option>
                        <option>HIP-HOP</option>
                        <option>EMD</option>
                    </select>
            </tr>
            <tr>
                <td><input type="submit"></td>
            </tr>

        </table>
    </form>
    </center>
</body>
</html>
